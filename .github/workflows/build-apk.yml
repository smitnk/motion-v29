name: MotionCanvas Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/v29-rebuild"
  pull_request:
    branches:
      - "main"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore complete timeline source before build
        run: |
          git show fe6f6429777dc7b4b5d5e6ddd63632a9deb18979:app/src/main/java/com/smitnk/motioncanvas/timeline/TimelineComponents.kt > app/src/main/java/com/smitnk/motioncanvas/timeline/TimelineComponents.kt
          sed -i 's/clickableimport androidx.compose.foundation.gestures.detectDragGestures/clickable\nimport androidx.compose.foundation.gestures.detectDragGestures/' app/src/main/java/com/smitnk/motioncanvas/timeline/TimelineComponents.kt
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9
      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: motioncanvas-debug-apk
          path: app/build/outputs/apk/debug/*.apk
